<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory | Brews &amp; Blessing</title>
  <link rel="stylesheet" href="Inventory.css">
  <script src="../ui-dialogs.js"></script>
  <script src="../nav.js"></script>
</head>
<body>
<div class="layout">

  <main class="content">
    <header class="topbar">
      <h1>Inventory</h1>
      <div class="pills">
        <span class="pill plain" id="todayPill">Today: —</span>
        <span class="pill" id="userPill">Logged in</span>
        <span class="pill" id="lowPill">Stock alerts: 0</span>
      </div>
    </header>

    <div class="toolbar">
      <input type="text" id="search" placeholder="Search item or scan barcode">
      <button class="btn ghost" id="scanBtn" title="Scan a barcode into the search box, then press Enter">Scan barcode</button>
      <button class="btn" onclick="document.getElementById('siItem').focus()">+ Stock-in</button>
      <button class="btn ghost" onclick="addItem()">+ Add item</button>
    </div>

    <section class="cards">
      <div class="card"><p>Available</p><h2 id="cntAvail">0</h2></div>
      <div class="card"><p>Low-stock</p><h2 id="cntLow">0</h2></div>
      <div class="card"><p>Out-of-stock</p><h2 id="cntOut">0</h2></div>
    </section>

    <section class="panel">
      <h3>Inventory Items</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th><th>Barcode</th><th>Unit</th><th>Unit Cost</th>
              <th>Beginning</th><th>Stock-in</th><th>Stock-out</th><th>Remaining</th>
              <th>Reorder level</th><th>Batch no.</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody id="itemRows"></tbody>
        </table>
      </div>
    </section>

    <div class="bottom-grid">
      <section class="panel">
        <h3>Stock movement log (FIFO)</h3>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Date</th><th>Item</th><th>Type</th><th>Qty</th><th>Batch no.</th><th>By</th></tr>
            </thead>
            <tbody id="moveRows"></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <h3>Stock-in form</h3>
        <label>Inventory name</label>
        <select id="siItem"></select>
        <div class="row">
          <div>
            <label>Quantity</label>
            <input type="number" id="siQty" min="1" step="1">
          </div>
          <div>
            <label>Batch no.</label>
            <input type="text" id="siBatch" placeholder="e.g. B04">
          </div>
        </div>
        <button class="btn full" onclick="saveStockIn()">Save stock-in</button>
        <p class="msg" id="msg"></p>
      </section>
    </div>
  </main>
</div>
<script src="../api-client.js"></script>
<script src="Inventory.js"></script>
<script>
  (function () {
    // shared sidebar + login check (same as the other pages)
    const user = BBNav.mount('inv');
    if (user) document.getElementById('userPill').textContent = 'Logged in: ' + user.role;
  })();
</script>
</body>
</html>
