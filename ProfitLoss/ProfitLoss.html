<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profit/Loss Report | Brews & Blessings</title>
  <link rel="stylesheet" href="ProfitLoss.css">
  <script src="../nav.js"></script>
</head>
<body>

  <main>
    <header class="page-head">
      <h1>Profit/Loss Report</h1>
    </header>

    <!-- Date filter bar -->
    <div class="filter-bar">
      <div class="date-field">
        <label for="fromDate">From</label>
        <input type="date" id="fromDate">
      </div>
      <div class="date-field">
        <label for="toDate">To</label>
        <input type="date" id="toDate">
      </div>
      <button type="button" id="applyFilterBtn" class="btn-apply">Apply</button>
    </div>

    <!-- Metrics Row 1 -->
    <div class="metrics-row-1">
      <div class="metric-card">
        <div class="metric-title">Total Sales</div>
        <div class="metric-value" id="valTotalSales">₱48,600</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Total Product Cost</div>
        <div class="metric-value" id="valProductCost">₱16,200</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Gross Profit</div>
        <div class="metric-value" id="valGrossProfit">₱32,400</div>
      </div>
    </div>

    <!-- Metrics Row 2 -->
    <div class="metrics-row-2">
      <div class="metric-card">
        <div class="metric-title">Operating Expense</div>
        <div class="metric-value" id="valOperatingExpense">₱21,800</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">Net Profit/Loss</div>
        <div class="metric-value" id="valNetProfit">₱10,600</div>
      </div>
    </div>

    <!-- Bottom Split -->
    <div class="bottom-grid">

      <!-- Left: Chart & Status -->
      <section class="card" aria-labelledby="chartHeading">
        <div class="status-title">
          Status: <span class="status-earning" id="statusText">Earning</span>
        </div>

        <div class="chart-container">
          <div class="chart-bar-group">
            <div class="bar bar-sales" style="height: 180px;" id="barSales" title="Sales: ₱48,600"></div>
            <div class="bar-label">Sales</div>
          </div>
          <div class="chart-bar-group">
            <div class="bar bar-product" style="height: 60px;" id="barProduct" title="Product cost: ₱16,200"></div>
            <div class="bar-label">Product cost</div>
          </div>
          <div class="chart-bar-group">
            <div class="bar bar-expense" style="height: 80px;" id="barExpense" title="Expenses: ₱21,800"></div>
            <div class="bar-label">Expenses</div>
          </div>
          <div class="chart-bar-group">
            <div class="bar bar-net" style="height: 40px;" id="barNet" title="Net: ₱10,600"></div>
            <div class="bar-label">Net</div>
          </div>
        </div>
      </section>

      <!-- Right: Reports List -->
      <section class="card" aria-labelledby="reportsHeading">
        <h2 id="reportsHeading">Reports</h2>

        <div class="reports-list">
          <button type="button" class="btn-report" data-report="Daily Sales Report">Daily Sales Report</button>
          <button type="button" class="btn-report" data-report="Monthly Sales Report">Monthly Sales Report</button>
          <button type="button" class="btn-report" data-report="Expense Report">Expense Report</button>
          <button type="button" class="btn-report" data-report="Best Selling Product Report">Best Selling Product Report</button>
          <button type="button" class="btn-report" data-report="Profit/Loss Summary">Profit/Loss Summary</button>
          <button type="button" class="btn-report" id="btnCsvExport" style="background: #9a5c2c; color: #fff; font-weight: 600;">📥 CSV Export</button>
        </div>
      </section>

    </div>
  </main>

  <!-- Report Modal -->
  <div class="modal-overlay" id="reportModal">
    <div class="modal-content">
      <h2 id="modalTitle" style="font-family: Georgia, serif; margin-top: 0;">Report View</h2>
      <div id="modalBody" style="margin: 16px 0; font-size: 14px; line-height: 1.6;"></div>
      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button type="button" id="modalCloseBtn" class="btn-apply" style="background: #9a5c2c;">Close</button>
      </div>
    </div>
  </div>

  <script src="ProfitLoss.js"></script>
</body>
</html>
